services:
  - type: web
    name: volleyball-pose-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --timeout 300 --workers 1 --threads 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /health
